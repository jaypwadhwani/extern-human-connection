<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Human Connection Prototypes</title><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
/* Layout: a thin prototype toolbar over a stage that renders the real product screens at desktop or phone width. */
:root{
  --bg:#f3f1f5; --fg:#1c1b1b; --fg-2:#484646; --panel:#ffffff; --line:#e3e1e6; --accent:#2853d2; --accent-soft:#dce1ff;
  --font-ui:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  /* Extern product tokens (from globals.css). The stage is always light because it renders the product. */
  --x-bg:#ffffff; --x-surface:#fdf8f8; --x-surface-container:#f4f0ef; --x-neutral:#f2f2f2; --x-on:#1c1b1b; --x-on-subtle:#484646; --x-muted:#797676;
  --x-outline:#939090; --x-outline-subtle:#c9c6c5; --x-divider:#e5e2e1; --x-gray-medium:#e3e3e3; --x-gray-light:#f2f2f2;
  --x-info:#2853d2; --x-info-container:#dce1ff; --x-blue-light:#dfe9fc; --x-blue-dark:#2550d0;
  --x-success:#006e20; --x-success-container:#c8ffc1; --x-green-light:#ecfdf1; --x-green-medium:#b5f7c9;
  --x-secondary-container:#ddd0dd; --x-pink-container:#fdcfe1; --x-purple-medium:#d3caf6; --x-error:#ba1a1a; --x-error-container:#ffdad6;
  --x-plum:#3b1f4a;
  --x-serif:"Instrument Serif",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#17161a; --fg:#f1eff4; --fg-2:#b6b2bd; --panel:#201f24; --line:#34323a; --accent:#8da4ff; --accent-soft:#2a3560; color-scheme:dark } }
:root[data-theme="dark"]{ --bg:#17161a; --fg:#f1eff4; --fg-2:#b6b2bd; --panel:#201f24; --line:#34323a; --accent:#8da4ff; --accent-soft:#2a3560; color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--x-info);outline-offset:2px}
.stage :focus-visible{outline:2px solid #2853d2;outline-offset:2px}

/* ---------- prototype toolbar ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--panel);border-bottom:1px solid var(--line);padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--panel)}
.bar h1{font-size:13px;font-weight:600;margin:0;letter-spacing:.01em;white-space:nowrap}
.bar h1 span{color:var(--fg-2);font-weight:500}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{border:0;background:transparent;color:var(--fg-2);padding:6px 10px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer}
.tab[aria-selected="true"]{background:var(--accent-soft);color:var(--fg)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--bg)}
.seg button{border:0;background:transparent;color:var(--fg-2);padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.bar .right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ghost{border:1px solid var(--line);background:transparent;color:var(--fg);padding:5px 10px;border-radius:999px;font-size:12px;font-weight:600;cursor:pointer}
@media (max-width:700px){ .seg.device{display:none} }

/* ---------- stage + notes ---------- */
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1800px;margin:0 auto}
@media (max-width:1100px){ .wrap{grid-template-columns:minmax(0,1fr)} }
.stagewrap{min-width:0;display:flex;justify-content:center;align-items:flex-start}
.stage{position:relative;width:100%;max-width:1440px;background:#fff;color:#1c1b1b;border-radius:12px;overflow:hidden;box-shadow:0 0 0 1px var(--line);container:stage / inline-size;font-family:var(--font-ui);font-size:14px;line-height:1.45;transform:translateZ(0);min-height:900px;display:flex;flex-direction:column}
.stage.phone{width:390px;max-width:100%;height:844px;min-height:0;border-radius:36px;box-shadow:0 0 0 10px #1c1b1b,0 0 0 11px #3a3838,0 30px 60px rgba(0,0,0,.25);overflow:auto;scrollbar-width:none}
.stage.phone::-webkit-scrollbar{display:none}
@media (max-width:700px){ .stage{min-height:0;height:calc(100dvh - 120px)} }
.notes{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;position:sticky;top:64px;max-height:calc(100dvh - 90px);overflow:auto;font-size:13px}
.notes h2{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-2);margin:0 0 6px;font-weight:600}
.notes h3{font-size:14px;margin:0 0 6px}
.notes p{margin:0 0 10px;color:var(--fg)}
.notes ul{margin:0 0 10px;padding-left:18px}
.notes li{margin-bottom:4px}
.notes .log{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;line-height:1.5;display:flex;flex-direction:column;gap:3px}
.notes .log div{display:flex;gap:8px;align-items:baseline}
.notes .log time{color:var(--fg-2);flex:none;font-variant-numeric:tabular-nums}
.notes .log b{font-weight:600;color:var(--accent)}
.notes .log i{font-style:normal;color:var(--fg-2)}
.notes .empty{color:var(--fg-2)}

/* ---------- Extern product chrome ---------- */
.x-top{height:64px;border-bottom:1px solid var(--x-divider);display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:#fff;flex:none}
.x-top .mark{font-family:var(--x-serif);font-size:26px;letter-spacing:-.01em;color:#1c1b1b;position:absolute;left:50%;transform:translateX(-50%)}
.x-top .ic{width:24px;height:24px;color:#1c1b1b}
.x-body{flex:1;background:var(--x-surface);position:relative}
.tw > *,.task,.footbar,.sticky{flex-shrink:0}
.x-pill{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 20px;border-radius:999px;font-weight:500;font-size:14px;border:1px solid transparent;cursor:pointer;white-space:nowrap;text-decoration:none;line-height:1}
.x-pill.dark{background:#1c1b1b;color:#fff}
.x-pill.dark:hover{background:#333}
.x-pill.blue{background:var(--x-info);color:#fff}
.x-pill.blue:hover{background:#1d3fa6}
.x-pill.out{background:#fff;color:#1c1b1b;border-color:var(--x-outline-subtle)}
.x-pill.out:hover{background:var(--x-gray-light)}
.x-pill.err{background:#ba1a1a;color:#fff}
.x-pill:disabled{background:var(--x-divider);color:#adaaaa;cursor:not-allowed;border-color:transparent}
.x-pill.sm{height:36px;padding:0 16px;font-size:13px}
.x-link{background:none;border:0;padding:0;color:var(--x-info);text-decoration:underline;cursor:pointer;font:inherit}
.x-link.quiet{color:var(--x-on-subtle)}
.x-card{background:#fff;border:1px solid var(--x-divider);border-radius:16px}
.x-input{width:100%;height:48px;border:1px solid var(--x-outline-subtle);border-radius:999px;padding:0 18px;font:inherit;font-size:15px;color:#1c1b1b;background:#fff}
.x-input:focus{border-color:#aa99ec;outline:none;box-shadow:0 0 0 1px #c4b8f3}
.x-ta{width:100%;border:1px solid var(--x-outline-subtle);border-radius:12px;padding:10px 12px;font:inherit;font-size:14px;line-height:20px;resize:none;color:#1c1b1b;background:#fff;display:block}
.x-ta:focus{border-color:#aa99ec;outline:none;box-shadow:0 0 0 1px #c4b8f3}
.x-ta::placeholder,.x-input::placeholder{color:#8e8c99}
.av{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;background:var(--x-info-container);color:#1c1b1b;font-weight:600;flex:none;position:relative}
.av.s48{width:48px;height:48px;font-size:17px}.av.s44{width:44px;height:44px;font-size:15px}.av.s40{width:40px;height:40px;font-size:15px}.av.s32{width:32px;height:32px;font-size:12px}.av.s24{width:24px;height:24px;font-size:10px}
.av.live::after{content:"";position:absolute;right:-1px;bottom:-1px;width:12px;height:12px;border-radius:999px;background:#18dd4c;border:2px solid #fff}
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:500;background:var(--x-neutral);color:#1c1b1b}
.chip.info{background:var(--x-info-container)}.chip.ok{background:var(--x-success-container)}.chip.pink{background:#fdcfe1}
.check{display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-size:14px;line-height:20px}
.check input{width:18px;height:18px;margin:1px 0 0;accent-color:#2853d2;flex:none}
.radio-row{display:flex;align-items:center;gap:12px;border:1px solid var(--x-gray-medium);border-radius:16px;padding:12px;cursor:pointer;background:#fff;font-weight:500;font-size:14px;line-height:20px}
.radio-row:hover{background:var(--x-gray-light)}
.radio-row input{width:18px;height:18px;margin:0;accent-color:#1c1b1b;flex:none}
.radio-row.on{border-color:#1c1b1b}
.fade{animation:fade .25s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* modal (Credenza desktop) / sheet (phone) */
.ovl{position:fixed;inset:0;background:rgba(28,27,27,.45);backdrop-filter:blur(6px);z-index:20;display:flex;align-items:center;justify-content:center;padding:24px}
.dlg{background:#fff;border-radius:24px;width:512px;max-width:100%;max-height:calc(100% - 24px);overflow:auto;padding:24px;display:flex;flex-direction:column;gap:16px;box-shadow:0 24px 60px rgba(28,27,27,.2)}
.dlg h2{font-size:20px;line-height:26px;font-weight:500;margin:0;text-wrap:balance}
.dlg .hd{display:flex;align-items:flex-start;gap:12px;justify-content:space-between}
.xbtn{width:32px;height:32px;border-radius:999px;border:1px solid var(--x-outline-subtle);background:#fff;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none;color:#1c1b1b}
.dlg .ft{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:16px}
@container stage (max-width:640px){
  .ovl{align-items:flex-end;padding:0}
  .dlg{border-radius:24px 24px 0 0;width:100%;max-height:92%;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px))}
  .dlg .ft{grid-auto-flow:row;grid-auto-columns:auto}
  .dlg .ft .x-pill.dark,.dlg .ft .x-pill.blue{order:-1}
}

/* ---------- trial wall ---------- */
.tw{min-height:100%;display:flex;flex-direction:column;background:radial-gradient(ellipse 60% 40% at 50% 28%,#e6e4ff 0%,#fdf8f8 70%)}
.strip{background:var(--x-info-container);display:flex;align-items:center;gap:12px;padding:10px 16px;min-height:52px;font-size:14px}
.strip .t{flex:1;min-width:0}
.strip .t b{font-weight:600}
.strip .x-pill{height:36px;padding:0 16px}
.strip.human{background:#dce1ff}
.strip .meta{color:var(--x-on-subtle);font-size:13px}
.steps{display:flex;justify-content:center;gap:12px;align-items:center;padding:22px 16px 6px;font-size:14px;flex-wrap:wrap}
.steps .s{display:flex;align-items:center;gap:8px;color:#1c1b1b}
.steps .dot{width:22px;height:22px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;background:#c8ffc1;color:#006e20}
.steps .dot.cur{background:var(--x-info);color:#fff}
.steps .ln{width:28px;height:1px;background:var(--x-outline-subtle)}
.tw h1{font-family:var(--x-serif);font-style:italic;font-weight:400;font-size:44px;line-height:1.1;text-align:center;margin:12px 16px 14px;letter-spacing:-.01em}
.cats{display:flex;justify-content:center;gap:28px;padding:0 16px 20px;flex-wrap:wrap}
.cat{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:15px;color:#1c1b1b;background:none;border:0;cursor:pointer}
.cat .ic{width:44px;height:44px;border-radius:999px;border:1px solid var(--x-outline-subtle);display:inline-flex;align-items:center;justify-content:center;background:#fff;color:var(--x-info)}
.cat.on .ic{border:2px solid var(--x-info)}
.cat.on{font-weight:600}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px;padding:4px 190px 24px;max-width:1440px}
@container stage (max-width:1200px){ .cards{padding:4px 40px 24px} }
@container stage (max-width:900px){ .cards{grid-template-columns:1fr;padding:4px 16px 24px} }
.rc{background:#fff;border:1px solid var(--x-divider);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.rc.best{border:2px solid var(--x-info);box-shadow:0 8px 24px rgba(40,83,210,.15)}
.rc .best-tag{background:var(--x-info);color:#fff;font-size:12px;font-weight:600;padding:8px 16px;display:flex;gap:6px;align-items:center}
.rc .img{height:66px;background:linear-gradient(135deg,#2b8a4b,#64c27d);position:relative}
.rc .img.b{background:linear-gradient(135deg,#5a6b7a,#b2bcc6)}
.rc .img.c{background:linear-gradient(135deg,#0d2c4a,#3d6b94)}
.rc .img .logo{position:absolute;left:16px;bottom:-22px;width:52px;height:52px;border-radius:999px;background:#fff;border:1px solid var(--x-divider);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;text-align:center;line-height:1.1;padding:4px}
.rc .bd{padding:24px 18px 14px;display:flex;flex-direction:column;gap:10px;flex:1}
.rc .tags{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;color:#484646}
.rc .tags .chip{height:22px;font-size:12px}
.rc h3{margin:0;font-size:18px;line-height:24px;font-weight:600}
.rc .why{background:var(--x-info-container);border-radius:10px;padding:10px 12px;font-size:14px}
.rc .leave{background:var(--x-surface-container);border-radius:10px;padding:10px 12px;font-size:14px;color:#484646}
.rc .leave b{color:#1c1b1b;font-weight:500}
.rc .lk{display:flex;justify-content:space-between;font-weight:500;font-size:15px;margin-top:auto}
.rc .lk .x-link{text-decoration:none;color:#1c1b1b}
.rc .lk .x-link.b{color:var(--x-info)}
.rc .ft{background:var(--x-green-light);padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;color:#484646}
.tw .more{text-align:center;padding:4px 16px 120px;font-size:15px}
.sticky{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--x-divider);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:16px;z-index:5;margin-top:auto}
.sticky .faces{display:flex}
.sticky .faces .av{width:36px;height:36px;border:2px solid #fff;margin-left:-8px;background:#d9c4b0;font-size:11px}
.sticky .faces .av:first-child{margin-left:0}
.sticky .claim{font-size:18px;flex:1;min-width:0}
.sticky .claim b{color:var(--x-info);font-weight:500}
.sticky .fine{font-size:12px;color:#484646}
.sticky .x-pill{height:48px;padding:0 28px;font-size:16px}
@container stage (max-width:640px){
  .tw h1{font-size:36px}
  .cats{gap:16px}
  .cat{font-size:14px}
  .sticky{flex-wrap:wrap}
  .sticky .claim{font-size:16px;order:1;flex:1 1 60%}
  .sticky .faces{order:2}
  .sticky .x-pill{order:3;width:100%;justify-content:center}
  .sticky .fine{order:4;width:100%;text-align:center}
  .strip{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:8px 12px;align-items:start}
  .strip .t{grid-column:2}
  .strip .xbtn{grid-column:3;grid-row:1}
  .strip .x-pill{grid-column:1/-1;justify-content:center}
}
/* ask sheet */
.sheet{position:fixed;right:24px;bottom:96px;width:380px;max-width:calc(100% - 32px);background:#fff;border-radius:20px;box-shadow:0 20px 60px rgba(28,27,27,.25),0 0 0 1px var(--x-divider);z-index:30;display:flex;flex-direction:column;overflow:hidden;max-height:70%}
.sheet .hd{display:flex;gap:12px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--x-divider)}
.sheet .hd .n{font-weight:600;font-size:15px;line-height:20px}
.sheet .hd .r{font-size:13px;color:#484646;line-height:18px}
.sheet .msgs{padding:14px 16px;display:flex;flex-direction:column;gap:10px;overflow:auto;flex:1}
.msg{max-width:85%;padding:10px 12px;border-radius:16px;font-size:14px;line-height:20px}
.msg.them{background:var(--x-surface-container);border-bottom-left-radius:6px;align-self:flex-start}
.msg.me{background:var(--x-info);color:#fff;border-bottom-right-radius:6px;align-self:flex-end}
.msg.sys{align-self:center;background:none;color:#484646;font-size:12.5px;text-align:center;max-width:100%;padding:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:0 16px 10px}
.chips button{border:1px solid var(--x-outline-subtle);background:#fff;border-radius:999px;padding:7px 12px;font-size:13px;cursor:pointer;color:#1c1b1b}
.chips button:hover{background:var(--x-gray-light)}
.sheet form{display:flex;gap:8px;padding:10px 12px 12px;border-top:1px solid var(--x-divider)}
.sheet form input{flex:1;min-width:0;height:40px;border:1px solid var(--x-outline-subtle);border-radius:999px;padding:0 14px;font:inherit;font-size:14px}
.sheet form button{height:40px;width:40px;border-radius:999px;border:0;background:#1c1b1b;color:#fff;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.sheet form button:disabled{background:var(--x-divider);color:#adaaaa}
@container stage (max-width:640px){ .sheet{right:0;left:0;bottom:0;width:100%;max-width:100%;border-radius:20px 20px 0 0;max-height:85%} }

/* ---------- account + cancel ---------- */
.acct{max-width:616px;margin:0 auto;padding:36px 16px 60px;display:flex;flex-direction:column;gap:14px}
.acct h2{font-size:20px;font-weight:500;margin:10px 0 0}
.row{display:flex;align-items:center;gap:16px;padding:14px 16px;min-height:60px}
.row + .row{border-top:1px solid var(--x-divider)}
.row .ic{width:40px;height:40px;border-radius:999px;background:var(--x-neutral);display:inline-flex;align-items:center;justify-content:center;flex:none;color:#1c1b1b;font-size:13px;font-weight:500}
.row .ic.ok{background:var(--x-success-container)}
.row .tx{flex:1;min-width:0}
.row .tx .a{font-size:15px;font-weight:500;line-height:20px}
.row .tx .b{font-size:13px;color:#484646;line-height:18px}
.row .x-pill.sm{height:36px}
.row .x-pill.cancel{border-color:#ba1a1a;color:#ba1a1a;background:#fff}
.pay{background:var(--x-info-container);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:8px}
.pay h3{margin:0;font-size:20px;font-weight:500}
.pay p{margin:0;font-size:15px;color:#1c1b1b}
.gift{display:flex;gap:16px;padding:16px;align-items:center}
.gift .art{width:108px;height:142px;border-radius:12px;background:linear-gradient(160deg,#0f4b3a,#1b7a5a);flex:none}
.gift h3{margin:0 0 6px;font-size:20px;font-weight:500}
.gift p{margin:0 0 10px;font-size:15px}
.callrow{background:var(--x-info-container);border-radius:16px}
.band{display:flex;align-items:center;gap:12px;background:var(--x-blue-light);margin:0 -24px;padding:14px 24px;font-size:15px}
.band b{font-weight:600}
.benefit{display:flex;align-items:center;gap:16px;border:1px solid var(--x-gray-medium);border-radius:16px;padding:16px}
.benefit .ic{width:40px;height:40px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.benefit .a{font-size:18px;font-weight:500;line-height:24px}
.benefit .b{font-size:16px;line-height:22px}
.person{display:flex;gap:16px;align-items:flex-start;background:var(--x-info-container);border-radius:16px;padding:16px}

.slot .d span{color:#484646;font-weight:400}
.slot .t{font-size:15px;font-weight:500;color:#1c1b1b}
.slot.on{border:2px solid #2853d2;background:#dce1ff;padding:13px 7px}
.hr .top{align-items:center}
.congrats{background:#fff;border:1px solid var(--x-divider);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px;margin-bottom:24px}
.side .congrats{margin:0}
.side .checkin{margin:0;flex-wrap:wrap}
.side .checkin .av{order:0}
.side .checkin .xbtn{order:1;margin-left:auto}
.side .checkin .tx{order:2;flex-basis:100%}
.side .checkin .acts .x-pill{flex:1 1 45%;justify-content:center}
.congrats .top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.congrats h2{margin:0;font-size:20px;font-weight:600}
.congrats p{margin:0;font-size:16px;line-height:22px}
.congrats .legend{display:flex;justify-content:space-between;font-size:12px;color:#484646}
.congrats .ready{background:var(--x-green-medium);border-radius:16px;padding:16px;gap:10px}
.congrats .ready .a{font-size:16px;font-weight:500}
.congrats .ready .b{font-size:15px;line-height:22px}
.peers{background:var(--x-info-container);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.peers .a{font-size:16px;font-weight:600;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.peers .b{font-size:15px;line-height:22px}
.peers .b b{font-weight:600}
.peers .acts{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.x-pill.blue-out{border-color:#2853d2;color:#2853d2;background:#fff}
.opt{align-items:center}
.opt.on{border:2px solid #2853d2;padding:13px}
.opt input{margin:0;width:20px;height:20px;accent-color:#2853d2}
.opt .mins{color:#797676;font-weight:400}
.faq .q{font-size:15px;font-weight:600;line-height:20px}
.faq .a{font-size:14px;line-height:20px;color:#484646;margin-top:2px}
@container stage (max-width:640px){
  .dlg::before{display:block}
  .dim{display:block;position:fixed;inset:0;background:rgba(28,27,27,.45);z-index:29;backdrop-filter:blur(3px);border:0;padding:0}
  .fab{right:16px}
  .fab.up{bottom:150px}
  .fab.pf-fab{bottom:8px}
  .peers .acts .x-pill.blue{flex:1 1 auto}
}
</style>

// ---------- 1. trial wall ----------
function trialWall() {
  const s = S.trial;
  const stripControl = `<div class="strip" role="status">
    <span aria-hidden="true" style="color:#2853d2">${I.chat}</span>
    <div class="t">Still deciding? Join a free live Q&amp;A, Thu, Nov 20 · 12:00 PM ET.</div>
    <button class="x-pill blue" data-a="tw-webinar">Save my spot</button>
    <button class="xbtn" aria-label="Dismiss" data-a="tw-dismiss" style="border:0;background:none">${I.x}</button>
  </div>`;
  const strip = arm === 'C' && s.stall && !s.dismissed ? stripControl : '';

  const card = (best, cls, logo, tags, title, mid) => `<article class="rc${best ? ' best' : ''}">
    ${best ? `<div class="best-tag">${I.star} Best fit for Finance</div>` : ''}
    <div class="img ${cls}"><div class="logo">${logo}</div></div>
    <div class="bd">
      <div class="tags">${tags}</div>
      <h3>${title}</h3>
      ${mid}
      <div class="lk"><button class="x-link">Learn more</button><button class="x-link${best ? ' b' : ''}">See first week</button></div>
    </div>
    <div class="ft"><span style="display:inline-flex;gap:6px;align-items:center">${I.lock} Included with membership</span><button class="x-pill ${best ? 'blue' : 'out'} sm" data-a="tw-start">Start $0 trial</button></div>
  </article>`;

  let human = '';
  if (arm === 'T' && s.stall) {
    if (s.sheet === 'intro') {
      human = `<div class="dim" data-a="tw-min"></div><section class="sheet intro fade" role="dialog" aria-labelledby="tw-it">
        <div class="hd">${avatar('C', 48, true)}<div style="flex:1;min-width:0"><div class="n" id="tw-it" style="font-size:18px">Hey! Need help deciding?</div></div><button class="xbtn" aria-label="Minimize" data-a="tw-min">${I.x}</button></div>
        <div class="intro-body">
          <p>I'm Carlinda, and I've helped many students choose their first Externship. Feel free to ask me anything!</p>
          <span class="ipill wide">${I.info} Responses usually take about 10 mins</span>
          <button class="x-pill blue" style="width:100%" data-a="tw-intro-ask">Ask Carlinda</button>
        </div>
      </section>`;
    } else if (s.sheet === 'chat') {
      human = `<div class="dim" data-a="tw-min"></div><section class="sheet fade" role="dialog" aria-label="Chat with Carlinda">
        <div class="hd">${avatar('C', 48, true)}<div style="flex:1;min-width:0"><div class="n">Carlinda Lee</div><div class="r">Available from 9 AM to 6 PM ET</div></div><button class="xbtn" aria-label="Minimize" data-a="tw-min">${I.x}</button></div>
        <div class="msgs" id="tw-msgs">
          <div class="msg them">Hi there, <span style="color:#2853d2">Jordan</span>! What is it that's making you hesitate? Time, cost, or which externship to pick?</div>
          ${s.msgs.map(m => `<div class="msg ${m.who}">${esc(m.text)}</div>`).join('')}
          ${s.sent ? `<div class="msg sys">Sent. Carlinda replies here and by email to jor•••@gmail.com. Minimize this and keep browsing.</div>` : ''}
        </div>
        ${s.sent ? '' : `<div class="chips stack" aria-label="Common questions">
          <button data-a="tw-chip" data-q="Is this a paid internship?">Is this a paid internship?</button>
          <button data-a="tw-chip" data-q="How many hours do I need to dedicate?">How many hours do I need to dedicate?</button>
          <button data-a="tw-chip" data-q="Which one should I pick?">Which one should I pick?</button>
          <button data-a="tw-chip" data-q="What happens after my trial ends?">What happens after my trial ends?</button>
        </div>`}
        <form data-f="tw-send"><label class="sr" for="tw-q">Your question</label><input id="tw-q" placeholder="${s.sent ? 'Add anything else' : 'Type your question'}" autocomplete="off"><button type="submit" class="blue" aria-label="Send">${I.send}</button></form>
      </section>`;
    } else {
      human = `<button class="fab up fade" data-a="tw-fab" aria-label="${s.sent ? 'Open your chat with Carlinda' : 'Ask Carlinda'}">${avatar('C', 44, true)}${s.sent ? '<span class="badge">1</span>' : ''}</button>`;
    }
  }

  return `${top()}<div class="x-body tw">
    ${strip}
    <div class="steps" aria-label="Progress"><span class="s"><span class="dot">${I.check}</span>Account</span><span class="ln"></span><span class="s"><span class="dot">${I.check}</span>Interests</span><span class="ln"></span><span class="s"><span class="dot">${I.check}</span>Matched</span><span class="ln"></span><span class="s"><span class="dot cur">4</span>Start your externship</span></div>
    <h1>Your top recommendations</h1>
    <p class="ctr" style="margin:-4px 16px 14px;font-size:16px;color:#484646">Showing 3 of 20+ projects matched to your interests</p>
    <div class="cats">
      <button class="cat"><span class="ic">${I.star}</span>For you</button>
      <button class="cat on"><span class="ic">${I.spark}</span>Finance</button>
      <button class="cat"><span class="ic">${I.users}</span>Gaming</button>
      <button class="cat"><span class="ic">${I.live}</span>Marketing</button>
    </div>
    <div class="cards">
      ${card(true, 'a', 'extern', `<span class="chip">Finance</span><span class="chip">Gaming</span><span style="margin-left:auto">Self-paced</span>`, 'Consumer Insights and Market Intelligence', `<div class="why"><b>Why this one:</b> you picked Finance.</div>`)}
      ${card(false, 'b', 'beats', `<span class="chip">Finance</span><span style="margin-left:auto;display:inline-flex;gap:8px">${I.cal} 8 weeks · Self-paced</span>`, 'Consumer Insights and Market Intelligence Sprint', `<div class="leave">You leave with <b>A consumer insights deck for Beats</b></div>`)}
      ${card(false, 'c', 'HP Tech Ventures', `<span class="chip">Financial Modeling &amp; Valuation</span><span class="chip">Finance</span><span style="display:inline-flex;gap:8px">${I.cal} 8 weeks · Self-paced</span>`, 'HP Tech Ventures: VC Deal Sourcing', `<div class="leave">You leave with <b>An investment memo on a real AI startup</b></div>`)}

  const k = e.target.dataset.in; if (!k) return;
  const v = e.target.type === 'checkbox' ? e.target.checked : e.target.value;
  const c = S.cancel, p = S.project1, f = S.portfolio, d = S.completion;
  const rerender = () => render(true);
  switch (k) {
    case 'c-reason': c.reason = v; ev('cancel_reason_select', { reason: v.slice(0, 24) }); rerender(); break;
    case 'c-other': c.other = v; break;
    case 'c-note': c.note = v; if (v.length === 1) ev('hc_cancel_note_started'); break;
    case 'c-likelihood': c.likelihood = v; rerender(); break;
    case 'p1-url': p.url = v; if (v.length === 1) ev('substep_answer_started'); rerender(); break;
    case 'p1-note': p.note = v; if (v.length === 1) ev('hc_review_note_started', { surface: 'project1' }); break;
    case 'pf-note': f.note = v; if (v.length === 1) ev('hc_review_note_started', { surface: 'portfolio' }); break;
    case 'd-choice': d.choice = v; ev('hc_help_option', { choice: v }); rerender(); break;
    case 'pk-note': S.pick.note = v; if (v.length === 1) ev('hc_pick_note_started'); break;
    case 'in-note': { const was = S.inact.note.trim().length > 0; S.inact.note = v; if (v.length === 1) ev('hc_checkin_note_started'); if (was !== (v.trim().length > 0)) rerender(); break; }
  }
});
$('#stage').addEventListener('submit', e => {
  if (e.target.dataset.f === 'tw-send') { e.preventDefault(); const q = $('#tw-q').value.trim(); if (!q) return; sendQ(q); }
});
function sendQ(q) { const s = S.trial; s.msgs.push({ who: 'me', text: q }); const first = !s.sent; s.sent = true; ev(first ? 'hc_ask_sent' : 'hc_ask_followup', { surface: 'trial_wall', chars: q.length }); render(); }

$('#stage').addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if (!b) return;
  const a = b.dataset.a; const s = S.trial, c = S.cancel, p = S.project1, f = S.portfolio, d = S.completion;
  switch (a) {
    case 'noop': ev('click', { target: b.textContent.trim().slice(0, 30) }); break;
    // trial wall
    case 'tw-stall': s.stall = true; if (arm === 'T') s.sheet = 'intro'; ev(arm === 'T' ? 'hc_intro_shown' : 'hc_strip_shown', { arm, trigger: 'stall_45s' }); break;
    case 'tw-dismiss': s.dismissed = true; ev('hc_strip_dismiss', { arm }); break;
    case 'tw-webinar': ev('webinar_save_spot_click'); s.dismissed = true; break;
    case 'tw-intro-ask': s.sheet = 'chat'; ev('hc_ask_open', { surface: 'trial_wall', from: 'intro' }); break;
    case 'tw-fab': s.sheet = 'chat'; ev('hc_ask_open', { surface: 'trial_wall', from: 'fab' }); break;
    case 'tw-min': ev('hc_ask_minimize', { from: s.sheet, sent: s.sent }); s.sheet = null; break;
    case 'tw-chip': ev('hc_ask_chip', { q: b.dataset.q }); sendQ(b.dataset.q); return;
    case 'tw-start': ev('trial_start_click', { arm, asked: s.sent }); break;
    // cancel
    case 'c-open': c.step = 's1'; ev('cancel_flow_open', { arm }); break;
    case 'c-close': c.step = 'account'; ev('cancel_flow_close'); break;
    case 'c-keep': c.step = 'account'; ev('cancel_keep_click', { arm }); break;
    case 'c-s1': c.step = 's1'; break;
    case 'c-reasons': c.step = 'reasons'; ev('cancel_continue_click', { from: 's1' }); break;
    case 'c-likely': ev('cancel_reason_submit', { reason: c.reason.slice(0, 24) }); if (arm === 'T') { c.step = 'talk'; ev('hc_talk_shown'); } else c.step = 'likely'; break;
    case 'c-talk': c.step = 'talk'; break;
    case 'c-talk-continue': c.step = 'likely'; ev('hc_talk_decline'); break;
    case 'c-book': c.step = 'book'; ev('hc_call_cta_click'); break;
    case 'c-slot': c.slot = Number(b.dataset.i); ev('hc_call_slot_pick', { slot: slotLabel(c.slot) }); break;
    case 'c-confirmbook': c.booked = slotLabel(c.slot); c.step = 'booked'; ev('hc_call_booked', { slot: c.booked }); break;
    case 'c-email': c.step = 'email'; ev('hc_email_instead_click'); break;
    case 'c-emailsend': c.reachSent = true; c.step = 'emailed'; ev('hc_reachout_requested', { surface: 'cancel', note_chars: c.note.length }); break;
    case 'c-confirm': c.cancelled = true; c.step = 'done'; ev('cancel_confirm', { likelihood: c.likelihood, booked: !!c.booked, reach: c.reachSent }); break;
    case 'c-cancelcall': c.prevBooked = c.booked; c.prevSlot = c.slot; c.booked = null; c.slot = null; c.callCancelled = true; ev('hc_call_cancelled', { slot: c.prevBooked, from: 'cancel_success' }); break;
    case 'c-undocancelcall': c.booked = c.prevBooked; c.slot = c.prevSlot; c.callCancelled = false; ev('hc_call_cancel_undo', { slot: c.booked }); break;
    // project 1
    case 'p1-ask': p.requested = true; ev('hc_review_requested', { surface: 'project1', note_chars: p.note.length, remaining: 1 }); break;
    case 'p1-edit': p.requested = false; break;
    case 'p1-next': p.modal = true; ev('substep_submit', { substep: 'P1.S1.3', review_requested: p.requested }); break;
    case 'p1-close': p.modal = false; break;
    // portfolio
    case 'pf-open': f.open = true; ev(f.requested ? 'hc_review_status_open' : 'hc_review_fab_click', { surface: 'portfolio' }); break;
    case 'pf-close': f.open = false; break;
    case 'pf-ask': f.requested = true; ev('hc_review_requested', { surface: 'portfolio', note_chars: 0 }); break;
    // completion
    case 'd-open': d.modal = true; d.faq = false; ev('hc_help_cta_click'); break;
    case 'd-close': d.modal = false; ev('hc_help_dismiss', { choice: d.choice || null }); break;
    case 'd-join': d.joined = true; d.modal = false; d.thanks = true; ev('hc_help_joined', { choice: d.choice }); break;
    case 'd-thanks-close': d.thanks = false; break;
    case 'd-undo': d.joined = false; d.choice = ''; ev('hc_help_withdrawn'); break;
    case 'd-faq': d.faq = true; ev('hc_help_faq_open'); break;
    case 'd-faq-close': d.faq = false; break;
    case 'd-faq-help': d.faq = false; d.modal = true; ev('hc_help_cta_click', { from: 'faq' }); break;
    // pick help
    case 'pk-open': S.pick.open = true; ev('hc_pick_open', { edit: S.pick.sent }); break;
    case 'pk-close': S.pick.open = false; ev('hc_pick_close', { goal: S.pick.goal || null }); break;
    case 'pk-dismiss': S.pick.dismissed = true; ev('hc_pick_dismiss'); break;
    case 'pk-goal': S.pick.goal = b.dataset.v; ev('hc_pick_goal', { goal: b.dataset.v }); break;
    case 'pk-between': { const v = b.dataset.v, arr = S.pick.between; const i = arr.indexOf(v); if (i >= 0) arr.splice(i, 1); else arr.push(v); ev('hc_pick_between', { n: arr.length }); break; }
    case 'pk-ask': S.pick.sent = true; S.pick.open = false; ev('hc_pick_requested', { goal: S.pick.goal, between: S.pick.between.length, note_chars: S.pick.note.length }); break;
    case 'pk-enroll': ev('enroll_click', { arm, asked: S.pick.sent }); break;
    // inactivity
    case 'in-stuck': S.inact.answer = 'stuck'; S.inact.email = false; ev('hc_checkin_answer', { answer: 'stuck' }); break;
    case 'in-busy': S.inact.answer = 'busy'; S.inact.email = false; ev('hc_checkin_answer', { answer: 'busy' }); ev('hc_checkin_snooze', { days: 14 }); break;
    case 'in-send': S.inact.sent = true; ev('hc_checkin_reachout_requested', { chars: S.inact.note.length }); break;
    case 'in-edit': S.inact.sent = false; break;
    case 'in-undo': S.inact.answer = S.inact.answer === 'busy' ? 'stuck' : ''; ev('hc_checkin_answer_change', { to: S.inact.answer || 'none' }); break;
    case 'in-dismiss': S.inact.dismissed = true; ev('hc_checkin_dismiss'); break;
    case 'in-email': S.inact.email = true; ev('email_preview_open'); break;
    case 'in-close': S.inact.email = false; break;
    case 'in-resume': ev('substep_resume_click', { from: S.inact.answer ? 'checkin_' + S.inact.answer : 'dashboard', arm }); break;
  }
  render();
});
setFlow(flow);
})();
</script>

</body></html>
